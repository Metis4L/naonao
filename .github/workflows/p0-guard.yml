name: P1.5 Guard (Advisor + IDE + OpenClaw)

on:
  pull_request:
    paths:
      - 'Makefile'
      - '.vscode/tasks.json'
      - 'projects/naonao-content-ops/**'
      - '.github/workflows/p0-guard.yml'
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - '.vscode/tasks.json'
      - 'projects/naonao-content-ops/**'
      - '.github/workflows/p0-guard.yml'
  workflow_dispatch:

concurrency:
  group: p15-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p15-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Ensure required files
        run: |
          test -f Makefile
          test -f projects/naonao-content-ops/handovers/root-manifest.json
          test -f projects/naonao-content-ops/handovers/work-order-shadow-monitoring.json
          test -f projects/naonao-content-ops/contracts/work-order.schema.json

      - name: Deterministic P1.5 guard chain
        run: |
          make preflight WORK_ORDER=projects/naonao-content-ops/handovers/work-order-shadow-monitoring.json
          make validate-json
          make validate-work-order-schema WORK_ORDER=projects/naonao-content-ops/handovers/work-order-shadow-monitoring.json GATE_REPORT=projects/naonao-content-ops/reports/hard-validator-gate.latest.json
          make execute-work-order WORK_ORDER=projects/naonao-content-ops/handovers/work-order-shadow-monitoring.json RUN_MODE=apply
          make shadow-monitoring

      - name: Guard checks (baseline + gate)
        run: |
          python3 - <<'PY'
          import json
          # baseline sanity (allow historical + current promoted baseline)
          ledger='projects/naonao-content-ops/handovers/iteration-ledger.json'
          d=json.load(open(ledger,'r',encoding='utf-8'))
          b=d.get('current_baseline',{}).get('iter_id')
          allowed={'iter6','iter8-minpatch'}
          if b not in allowed:
              raise SystemExit(f'baseline not in allowed set {allowed}: {b}')
          # gate must pass
          g='projects/naonao-content-ops/reports/hard-validator-gate.latest.json'
          gd=json.load(open(g,'r',encoding='utf-8'))
          if gd.get('decision') != 'pass':
              raise SystemExit(f'gate not pass: {gd.get("decision")}, reason={gd.get("reason")}')
          print('guard ok:', {'baseline': b, 'gate': gd.get('decision')})
          PY

      - name: Upload guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p15-guard-artifacts
          path: |
            projects/naonao-content-ops/reports/preflight.latest.json
            projects/naonao-content-ops/reports/validate-json-batch.latest.json
            projects/naonao-content-ops/reports/work-order-schema-validation.latest.json
            projects/naonao-content-ops/reports/execution-report-wo_wo_shadow_monitoring_iter8_candidate.json
            projects/naonao-content-ops/reports/hard-validator-gate.latest.json
            projects/naonao-content-ops/reports/correction-regression-shadow-monitoring.json
            projects/naonao-content-ops/handovers/iteration-ledger.json
          if-no-files-found: warn
